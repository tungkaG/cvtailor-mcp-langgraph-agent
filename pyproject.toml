[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvtailor-mcp-langgraph-agent"
version = "0.1.0"
description = "AI job-application assistant using MCP server, LangGraph, and LangChain"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CVTailor Team"}
]
keywords = ["mcp", "langgraph", "langchain", "huggingface", "ai", "job-application"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp",
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-huggingface",
    "huggingface-hub",
    "pydantic",
    "typer",
    "rich",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
cvtailor = "cvtailor_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
